<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lbfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="metalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>
  </defs>
  <!-- Background Rounded Shield / Workshop Badge -->
  <rect width="512" height="512" rx="104" fill="url(#metalGlow)" />
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#lbfGrad)" stroke-width="12" stroke-dasharray="16 8" />
  
  <!-- Industrial Boring Bar Ring / Center Bore Icon -->
  <circle cx="256" cy="230" r="130" fill="none" stroke="#44403c" stroke-width="24" />
  <circle cx="256" cy="230" r="95" fill="#1c1917" stroke="url(#lbfGrad)" stroke-width="14" />
  
  <!-- Crosshairs / Optical Alignment Alignment Marks -->
  <line x1="256" y1="70" x2="256" y2="110" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="350" x2="256" y2="390" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <line x1="96" y1="230" x2="136" y2="230" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <line x1="376" y1="230" x2="416" y2="230" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  
  <!-- LBF Bold Monogram -->
  <text x="256" y="260" font-family="'Chakra Petch', 'Impact', sans-serif" font-weight="900" font-size="108" fill="#f59e0b" text-anchor="middle" letter-spacing="4">LBF</text>
  
  <!-- Sub-label -->
  <rect x="136" y="385" width="240" height="50" rx="12" fill="#f59e0b" />
  <text x="256" y="420" font-family="'Chakra Petch', sans-serif" font-weight="800" font-size="24" fill="#0c0a09" text-anchor="middle" letter-spacing="2">SOLUTIONS</text>
</svg>
